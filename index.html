<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Temporizador de 20 Minutos</title>
 <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="img/alarma-3d.png">
</head>
<body>

  <div class="card">
    <h1>Alarma / Temporizador</h1>
    
    <div>
      <label for="minutesInput">Minutos:</label>
      <input type="number" id="minutesInput" value="20" min="1" max="180">
    </div>

    <div class="timer-display" id="display">20:00</div>

    <div class="controls">
      <button class="btn-start" id="startBtn">Iniciar</button>
      <button class="btn-pause" id="pauseBtn" disabled>Pausar</button>
      <button class="btn-stop" id="stopBtn" disabled>Detener</button>
    </div>
  </div>

  <script>
    let countdown = null;
    let alarmInterval = null;
    let totalSeconds = 0;
    let isPaused = false;

    const display = document.getElementById('display');
    const minutesInput = document.getElementById('minutesInput');
    const startBtn = document.getElementById('startBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const stopBtn = document.getElementById('stopBtn');

    function requestNotificationPermission() {
      if ("Notification" in window && Notification.permission !== "granted") {
        Notification.requestPermission();
      }
    }

    function showNotification() {
      if ("Notification" in window && Notification.permission === "granted") {
        new Notification("¡Tiempo completado! ⏰", {
          body: "El temporizador de 20 minutos ha finalizado.",
          requireInteraction: true
        });
      }
    }

    // Melodía suave tipo xilófono/campanada (Web Audio API)
    function playChime() {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const notes = [523.25, 659.25, 783.99, 1046.50]; // Frecuencias Do, Mi, Sol, Do (C5-C6)

      notes.forEach((freq, index) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

        const startTime = audioCtx.currentTime + (index * 0.12); // Desfase entre notas
        gain.gain.setValueAtTime(0, startTime);
        gain.gain.linearRampToValueAtTime(0.2, startTime + 0.03); // Ataque suave
        gain.gain.exponentialRampToValueAtTime(0.0001, startTime + 1.2); // Desvanecimiento natural

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(startTime);
        osc.stop(startTime + 1.2);
      });
    }

    function startAlarmSound() {
      playChime();
      // Repite la campanada cada 2.5 segundos
      alarmInterval = setInterval(playChime, 2500);
    }

    function updateDisplay(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = seconds % 60;
      display.textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }

    function runTimer() {
      countdown = setInterval(() => {
        if (!isPaused) {
          totalSeconds--;
          updateDisplay(totalSeconds);

          if (totalSeconds <= 0) {
            clearInterval(countdown);
            countdown = null;
            pauseBtn.disabled = true;
            startAlarmSound();
            showNotification();
          }
        }
      }, 1000);
    }

    startBtn.addEventListener('click', () => {
      requestNotificationPermission();
      clearInterval(countdown);
      clearInterval(alarmInterval);

      const mins = parseInt(minutesInput.value, 10) || 20;
      totalSeconds = mins * 60;
      isPaused = false;

      updateDisplay(totalSeconds);
      
      startBtn.disabled = true;
      pauseBtn.disabled = false;
      stopBtn.disabled = false;
      pauseBtn.textContent = 'Pausar';

      runTimer();
    });

    pauseBtn.addEventListener('click', () => {
      isPaused = !isPaused;
      pauseBtn.textContent = isPaused ? 'Reanudar' : 'Pausar';
    });

    stopBtn.addEventListener('click', () => {
      clearInterval(countdown);
      clearInterval(alarmInterval);
      countdown = null;
      isPaused = false;

      const mins = parseInt(minutesInput.value, 10) || 20;
      updateDisplay(mins * 60);

      startBtn.disabled = false;
      pauseBtn.disabled = true;
      stopBtn.disabled = true;
      pauseBtn.textContent = 'Pausar';
    });

    minutesInput.addEventListener('input', () => {
      if (!countdown) {
        const mins = parseInt(minutesInput.value, 10) || 0;
        updateDisplay(mins * 60);
      }
    });
  </script>
</body>
</html>
