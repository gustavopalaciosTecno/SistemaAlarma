<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Temporizador de 20 Minutos</title>
  <link rel="stylesheet" href="styles.css">
  </head>
<body>

  <div class="card">
    <h1>Alarma / Temporizador</h1>
    
    <div>
      <label for="minutesInput">Minutos:</label>
      <input type="number" id="minutesInput" value="20" min="1" max="180">
    </div>

    <div class="timer-display" id="display">20:00</div>

    <div class="controls">
      <button class="btn-start" id="startBtn">Iniciar</button>
      <button class="btn-pause" id="pauseBtn" disabled>Pausar</button>
      <button class="btn-stop" id="stopBtn" disabled>Detener</button>
    </div>
  </div>

  <script>
    let countdown = null;
    let alarmInterval = null;
    let totalSeconds = 0;
    let isPaused = false;

    const display = document.getElementById('display');
    const minutesInput = document.getElementById('minutesInput');
    const startBtn = document.getElementById('startBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const stopBtn = document.getElementById('stopBtn');

    // Permiso para notificaciones nativas del sistema
    function requestNotificationPermission() {
      if ("Notification" in window && Notification.permission !== "granted") {
        Notification.requestPermission();
      }
    }

    function showNotification() {
      if ("Notification" in window && Notification.permission === "granted") {
        new Notification("¡Tiempo completado! ⏰", {
          body: "El temporizador de 20 minutos ha finalizado.",
          requireInteraction: true
        });
      }
    }

    // Sonido de pitido sintetizado
    function playBeep() {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      osc.stop(audioCtx.currentTime + 0.5);
    }

    function startAlarmSound() {
      playBeep();
      alarmInterval = setInterval(playBeep, 1000);
    }

    function updateDisplay(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = seconds % 60;
      display.textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }

    function runTimer() {
      countdown = setInterval(() => {
        if (!isPaused) {
          totalSeconds--;
          updateDisplay(totalSeconds);

          if (totalSeconds <= 0) {
            clearInterval(countdown);
            countdown = null;
            pauseBtn.disabled = true;
            startAlarmSound();
            showNotification();
          }
        }
      }, 1000);
    }

    startBtn.addEventListener('click', () => {
      requestNotificationPermission();
      clearInterval(countdown);
      clearInterval(alarmInterval);

      const mins = parseInt(minutesInput.value, 10) || 20;
      totalSeconds = mins * 60;
      isPaused = false;

      updateDisplay(totalSeconds);
      
      startBtn.disabled = true;
      pauseBtn.disabled = false;
      stopBtn.disabled = false;
      pauseBtn.textContent = 'Pausar';

      runTimer();
    });

    pauseBtn.addEventListener('click', () => {
      isPaused = !isPaused;
      pauseBtn.textContent = isPaused ? 'Reanudar' : 'Pausar';
    });

    stopBtn.addEventListener('click', () => {
      clearInterval(countdown);
      clearInterval(alarmInterval);
      countdown = null;
      isPaused = false;

      const mins = parseInt(minutesInput.value, 10) || 20;
      updateDisplay(mins * 60);

      startBtn.disabled = false;
      pauseBtn.disabled = true;
      stopBtn.disabled = true;
      pauseBtn.textContent = 'Pausar';
    });

    minutesInput.addEventListener('input', () => {
      if (!countdown) {
        const mins = parseInt(minutesInput.value, 10) || 0;
        updateDisplay(mins * 60);
      }
    });
  </script>
</body>
</html>
